multiplexer: tmux
package-manager: brew
shell-manager: zimfw
shell: zsh
terminal: wezterm

aliases:
  # ls: ls_2_exa'
  # lsa: ls -lah'
  ack: ag && ag || ack
  c: code .
  cat: bat
  dclsa: docker container ls -a --format "table {{.Names}}\t{{.State}}\t{{.RunningFor}}\t{{.Ports}}" | tail -n+2 | sort
  dcr: docker stop $(basename $(pwd)) || true ; docker rm $(basename $(pwd)) ; docker compose up --remove-orphans
  dcra: docker ps -aq | xargs docker rm
  dcraf: docker ps -aq | xargs docker rm -f
  dcrd: docker stop $(basename $(pwd)) || true ; docker rm $(basename $(pwd)) ; docker compose up -d --remove-orphans
  dcsa: docker ps -q | xargs docker stop
  df: duf
  dim: docker images -a
  dira: docker images | grep none | col 3 | xargs docker rmi -f
  docker-ls-quiet: docker ps -a | sed -r 's/.*([0-9]]{1,3}\.[0-9]]{1,3}\.[0-9]]{1,3}\.[0-9]]{1,3}).*/\n\t\t\1/g' | sed -r "s/^([0-9a-z]{12})/\n\1/g"
  drm: docker_container_remove
  frm: /bin/rm -rf
  gc: git commit --verbose -S
  gd: git diff --indent-heuristic --minimal --numstat
  gfp: git fetch --all --prune
  ggsync: gfp ; git stash ; ggpull ; ggpush ; git stash pop
  go-fix: goimports -w ./.. ; go mod tidy
  go-test: go-fix ; go clean -testcache ; go test ./...
  gsl: git stash list
  gst: git status --branch --show-stash --untracked-files=all --ignore-submodules=untracked --column=always --renames --find-renames=70%
  gt: go test ./...
  la: eza -la --icons --color=auto --group-directories-first
  ll: eza -l --icons --color=auto --group-directories-first
  ls: eza --icons --color=auto --group-directories-first
  mv: /bin/mv
  new-guid: uuidgen | tr "[A-Z]" "[a-z]"
  path: echo -e ${PATH//:/\\n}
  penv: printenv | grep -w
  ports: sudo lsof -i -P -n | grep LISTEN
  python: python3
  reload: exec ${SHELL} -l
  s: screen
  sl: screen -list
  sr: screen -r
  td: todo_zsh
  tda: td add
  tdls: td top
  watch-docker-all: watch -d -c -n 1 -x docker ps --all --format "table {{.Names}}\t{{.Ports}}\t{{.Image}}\t{{.Status}}"

envs:
  # HOSTNAME: $(hostname -s)
  # IP_CURRENT: $(ipconfig getifaddr en0 || ifconfig | grep "inet " | grep -Fv 127.0.0.1 | awk '{print $2}' | head -1)
  # GID: $(id -g)
  # GPG_TTY: $(tty)
  # IP_PUBLIC: $(curl -sL checkip.amazonaws.com)
  # UID: $(id -u)
  0:
    ATUIN_NOBIND: true
    BUILDKIT_STEP_LOG_MAX_SIZE: -1
    BUILDKIT_STEP_LOG_MAX_SPEED: -1
    CLICOLOR: true
    COLORTERM: truecolor
    COMPLETION_WAITING_DOTS: true
    DISABLE_AUTO_TITLE: true
    DISABLE_LS_COLORS: false
    EDITOR: nano
    EMOJI_CLI_KEYBIND: ^e
    ENABLE_CORRECTION: false
    GIT_DISCOVERY_ACROSS_FILESYSTEM: true
    GREP_COLORS: mt=30;103
    HISTDUP: erase # erase duplicates in the history file
    HOMEBREW_NO_ENV_HINTS: 1
    HYPHEN_INSENSITIVE: true
    LANG: en_US.UTF-8
    LANGUAGE: en_US.UTF-8
    LC_ALL: en_US.UTF-8
    LC_CTYPE: en_US.UTF-8
    LDFLAGS: -I /opt/homebrew/opt/openssl@3/include -L /opt/homebrew/opt/openssl@3/lib
    LESS: -erX
    MICRO_TRUECOLOR: 1
    MY_PLACE: home
    OS: darwin
    PAGER: less
    SAVEHIST: 999999
    SHELL_DEBUG: 0
    SHELL_PROFILE: 0
    SHELL_TRACE: 0
    SSH_AUTH_SOCK: $HOME/Library/Group\ Containers/2BUA8C4S2C.com.1password/t/agent.sock
    TERM: xterm-256color
    VISUAL: nano
  1:
    GOPATH: $HOME/go
    HISTSIZE: $SAVEHIST
    NANORC_FILE: $HOME/.nanorc
    STARSHIP_CACHE: $HOME/.cache/starship
    TMP_USER: $HOME/sync/tmp/$HOSTNAME
    VSCODE_CLI_DATA_DIR: $HOME/.vscode-server/cli
    ZDOTDIR: $HOME/dotfiles/cli/zsh/zdotdir
  2:
    ELAPSED_TIME_ROOT: $TMP_USER/elapsed_time/$SESSION_ID
    STARSHIP_CONFIG: $HOME/dotfiles/cli/starship/theme/starship.toml

