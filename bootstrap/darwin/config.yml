#       action: install|remove|purge (install is default).
#       command: used when installer is a custom shell command. this fields ignores manager field.
#       curl_url: used when curl is choose.
#       dest: used when installation path needs a different location.
#       manager: curl|brew|pip|apt|winget|go|npm|git|brew-cask (default in top field 'package-manager').
#       url: used when installation needs a custom URL location.
#       version: used when needs diferent version from latest.
