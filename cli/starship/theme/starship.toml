"$schema" = 'https://starship.rs/config-schema.json'

# bar_section_char_start = ''
# bar_section_char_separator = ''
# bar_section_char_end = ''

format = """
[█](fg:color_section_1)\
$time\
[█ ](fg:color_section_1 bg:color_section_2)\
$os\
$hostname\
$username\
[█ ](fg:color_section_2 bg:color_section_3)\
$localip\
[█ ](fg:color_section_3 bg:color_section_4)\
${custom.atuin_history_lines}\
[█ ](fg:color_section_4 bg:color_section_5)\
$docker_context\
$docker\
$gcloud\
[█ ](fg:color_section_5 bg:color_section_6)\
$golang\
$lua\
$nodejs\
$php\
$python\
$ruby\
$rust\
$terraform\
[█ ](fg:color_section_6 bg:color_section_7)\
$git_branch\
$git_commit\
$git_metrics\
$git_state\
$git_status\
[█ ](fg:color_section_7 bg:color_section_8)\
$jobs\
$status\
[█ ](fg:color_section_8 bg:color_section_9)\
[⏱ ](bg:color_section_9 fg:color_foreground_text_light)\
$cmd_duration\
[](fg:color_section_9)\
$line_break\
$directory\
$line_break\
$sudo\
$character\
"""

add_newline = true
command_timeout = 10000
palette = 'my_pallete'
scan_timeout = 10000

[character]
disabled = false
error_symbol = '[🚨](bold fg:color_section_5) '
format = '$symbol'
success_symbol = '[▶](bold fg:color_section_3) '

[cmd_duration]
disabled = false
format = '[$duration]($style)'
min_time = 1
min_time_to_notify = 5_000
notification_timeout = 2_000
show_milliseconds = true
show_notifications = true
style = 'bg:color_section_9 fg:color_foreground_text_light'

[custom.atuin_history_lines]
command = "$HOME/dotfiles/cli/starship/functions/starship_atuin_history_lines"
disabled = false
format = '[$symbol$output]($style)'
style = 'bg:color_section_4 fg:color_foreground_text_dark'
symbol = '󱆃 '
# symbol = '≣'
when = true

[directory]
disabled = false
truncate_to_repo = false
format = '[at $path](italic $style)'
truncation_length = 0

[docker_context]
disabled = false
symbol = "🐳"

[fill]
symbol = '-'
style = 'bold green'

[gcloud]
disabled = false
format = '[$symbol $project:$region]($style)'
style = 'bg:color_section_5 fg:color_foreground_text_dark'
symbol = '🇬️ ☁️ '

[gcloud.project_aliases]
very-long-project-name = 'vlpn'
stellar-operand-420618 = 'tec'

[gcloud.region_aliases]
us-central1 = 'uc1'

[git_branch]
disabled = false
format = '[$symbol $branch]($style)'
style = 'bg:color_section_7 fg:color_foreground_text_dark'
symbol = ''

[git_commit]
disabled = false
commit_hash_length = 4
style = 'bg:color_section_7 fg:color_foreground_text_dark'

[git_metrics]
disabled = false
format = '([+$added]($added_style))([-$deleted]($deleted_style))'
ignore_submodules = true
added_style = 'bg:color_section_7 fg:green'
deleted_style = 'bg:color_section_7 fg:color_section_5'

[git_state]
disabled = false
style = 'bg:color_section_7 fg:color_foreground_text_dark'
format = '\([$state($progress_current/$progress_total)]($style)\)'

[git_status]
disabled = false
style = 'bg:color_section_7 fg:color_foreground_text_dark'
format = '([\[$all_status$ahead_behind\]]($style))'

[golang]
format = '[$symbol $version $mod_version]($style)'
disabled = false
symbol = "🦫"
style = 'bg:color_section_6 fg:color_foreground_text_dark'

[hostname]
disabled = false
format = '[ $hostname]($style)'
ssh_only = false
style = 'bg:color_section_2 fg:color_foreground_text_light'

[line_break]
disabled = false

[localip]
disabled = false
ssh_only = false
style = 'bg:color_section_3 fg:color_foreground_text_dark'
format = '[$localipv4]($style)'

[lua]
disabled = false
format = '[ $symbol$version]($style)'
style = 'bg:color_section_6 fg:color_foreground_text_dark'

[nodejs]
disabled = false
symbol = "🤮"

[os]
format = "[$symbol]($style)"
disabled = false
style = 'bg:color_section_2 fg:color_foreground_text_light'

[os.symbols]
Alpine = " "
Debian = " "
Linux = " "
Macos = " "
Raspbian = " "
Ubuntu = "󰕈 "
Unknown = " "
Windows = "󰍲 "

[palettes.my_pallete]
color_foreground_text_dark = '#001219'
color_foreground_text_light = '#E9D8A6'
color_section_1 = '#005f73'
color_section_2 = '#0a9396'
color_section_3 = '#94d2bd'
color_section_4 = '#e9d8a6'
color_section_5 = '#ee9b00'
color_section_6 = '#ca6702'
color_section_7 = '#bb3e03'
color_section_8 = '#ae2012'
color_section_9 = '#9B2226'
color_section_10 = '#6b0f12'

[php]
disabled = false
format = '[$symbol $version]($style)'
symbol = "🐘"
style = 'bg:color_section_6 fg:color_foreground_text_dark'

[python]
detect_env_vars = ["VIRTUAL_ENV"]
disabled = false
format = '[ $symbol$version$virtualenv]($style)'
style = 'bg:color_section_6 fg:color_foreground_text_dark'

[ruby]
disabled = true
symbol = '🔺 '
style = 'bg:color_section_5 fg:color_foreground_text_dark'

[rust]
disabled = true
symbol = "🦀"
style = 'bg:color_section_6 fg:color_foreground_text_dark'

[status]
disabled = false
format = '[$symbol]($style)'
style = 'bg:color_section_8 fg:color_foreground_text_light'
success_symbol = '✓'
symbol = '$status'

[sudo]
format = '[$symbol]($style)'
disabled = false
symbol = '🔓'
style = 'bold red'

[terraform]
disabled = false
format = '[$symbol$version]($style)'
style = 'bg:color_section_6 fg:color_foreground_text_dark'

[time]
format = '[  $time]($style)'
disabled = false
style = 'bg:color_section_1 fg:color_foreground_text_light'

[username]
disabled = true
format = '[$user]($style)'
show_always = true
style_user = 'bg:color_section_3 fg:color_foreground_text_light'
